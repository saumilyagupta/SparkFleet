# Managed by clusterctl. ZooKeeper ensemble used for Spark master leader election.
tickTime=2000
initLimit=10
syncLimit=5
dataDir={{zookeeper_data}}
clientPort={{zookeeper_client_port}}
clientPortAddress={{host_ip}}
# The admin HTTP server defaults to port 8080, which would collide with a Spark master UI.
admin.enableServer=false
4lw.commands.whitelist=srvr,ruok,stat,mntr
autopurge.snapRetainCount=3
autopurge.purgeInterval=24
{{zookeeper_servers}}
