# Managed by clusterctl. Manual edits are overwritten on the next provision.
spark.master                      spark://{{master_ip}}:{{master_port}}
# A driver started on this node (client mode) advertises this node's LAN IP,
# so executors on other machines can connect back to it.
spark.driver.host                 {{host_ip}}
spark.driver.bindAddress          {{host_ip}}
spark.driver.port                 {{driver_port}}
spark.blockManager.port           {{block_manager_port}}
spark.port.maxRetries             32
spark.eventLog.enabled            true
spark.eventLog.dir                file://{{data_dir}}/events
# Failure handling: a task may be retried 4 times before the job fails.
spark.task.maxFailures            4
spark.ui.port                     4040
